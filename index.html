<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1020">
<meta name="description" content="KAMBIO by MACC: calorías con foto, rutinas de gimnasio, agua, suplementos y Kambito.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kambio">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px system-ui,-apple-system,sans-serif;overscroll-behavior-y:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kambio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: app de una columna para celular; barra superior con marcas de carril, navegación inferior fija, pista ovalada como indicador principal */
:root{
  --ink:#0C1020; --panel:#141A2E; --panel2:#1B2340; --line:#29325A; --text:#F2F4FB; --muted:#8F98BA; --dim:#5C6690;
  --track:#FF5733; --trackSoft:#3A1C1C; --lane:#24182A; --amber:#FFB321; --cyan:#38D1F2; --good:#3DDC97; --coral:#FF8A65; --skin:#F2A878; --skin2:#D98A5C; --shorts:#2B3566; --shirt2:#C93A1C; --hair:#3A2418; --bad:#FF6B6B;
  --fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fl:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--ink)}
.top::after{content:"";display:block;height:4px;background:repeating-linear-gradient(90deg,var(--track) 0 26px,var(--ink) 26px 30px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{font-family:var(--fd);font-weight:900;font-size:28px;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:8px;transform:skewX(-8deg)}
.logo i{display:block;width:10px;height:24px;background:var(--track);transform:skewX(-14deg)}
.logo b{color:var(--track);font-weight:900}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.sig{font-family:var(--fl);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.chip{font-family:var(--fl);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--panel2);color:var(--text);white-space:nowrap}
.chip.hot{background:var(--track);color:#fff}

main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px;padding-block:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.lbl{font-family:var(--fl);text-transform:uppercase;letter-spacing:.09em;font-size:13px;font-weight:600;color:var(--muted)}
.num{font-family:var(--fd);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--fd);font-weight:800;font-size:26px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase}
h3{font-family:var(--fl);font-weight:700;font-size:19px;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.sec{display:flex;flex-direction:column;gap:10px}

.btn{font-family:var(--fl);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px;border:0;border-radius:12px;padding:13px 18px;background:var(--track);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.soft{background:var(--panel2);color:var(--text)}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;padding:4px 0;color:var(--cyan);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* pista ovalada */
.hero{position:relative;overflow:hidden;background:var(--panel);border-radius:20px;padding:14px 14px 16px;border:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,transparent 0 18px,rgba(255,87,51,.05) 18px 20px);pointer-events:none}
.track{position:relative;width:100%;max-width:420px;margin:0 auto;display:block}
.track svg{width:100%;height:auto;display:block}
.track .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.track .big{font-size:clamp(38px,11vw,56px);line-height:.9}
.prog{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.legend i{width:14px;height:4px;border-radius:2px;display:block}

.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.macro{background:var(--panel2);border-radius:12px;padding:10px}
.macro .v{font-size:24px;line-height:1}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:3px}

.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:26px;height:34px;border-radius:4px 4px 8px 8px;border:2px solid var(--cyan);background:transparent;padding:0;cursor:pointer;position:relative;overflow:hidden}
.glass.on{background:linear-gradient(to top,var(--cyan) 75%,transparent 75%)}

.wkb,.wkl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wkb{height:100px;position:relative;align-items:end}
.wkb .col{height:100%;display:flex;align-items:flex-end;justify-content:center}
.wkb .b{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--panel2)}
.wkb .b.ok{background:var(--track)}
.wkb .b.over{background:var(--amber)}
.wkl .d{font-family:var(--fl);font-size:12px;color:var(--muted);text-transform:uppercase;text-align:center}
.wkl .d.t{color:var(--text);font-weight:700}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--cyan);pointer-events:none}

/* entreno */
.session{display:flex;gap:14px;align-items:stretch}
.daytag{flex:0 0 auto;width:58px;border-radius:12px;background:var(--track);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;transform:skewX(-6deg)}
.daytag .num{font-size:26px;line-height:1}
.daytag span{font-family:var(--fl);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.daytag.rest{background:var(--panel2);color:var(--muted)}
.daytag.done{background:var(--good);color:#06281A}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ph{border-radius:10px;padding:8px;background:var(--panel2);border:1.5px solid transparent;text-align:left;cursor:pointer;min-width:0}
.ph .num{font-size:22px;line-height:1}
.ph span{display:block;font-family:var(--fl);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.cur{border-color:var(--track)}
.ph.sel{background:var(--track)}
.ph.sel span{color:#fff}
.daycard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dayhead{display:flex;gap:12px;align-items:center;padding:12px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.dayhead .meta{flex:1;min-width:0}
.pill{font-family:var(--fl);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.good{background:rgba(61,220,151,.15);color:var(--good)}
.pill.hot{background:rgba(255,87,51,.15);color:var(--track)}
.ex{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.ex .top-line{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex .name{font-weight:700;font-size:16px;min-width:0}
.ex .presc{font-size:26px;line-height:1;white-space:nowrap;color:var(--track)}
.ex .sub{display:flex;gap:6px;flex-wrap:wrap}
.ex .tip{font-size:13px;color:var(--muted)}
.ex .ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kg{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:10px;padding:4px 10px}
.kg input{width:64px;background:transparent;border:0;font-family:var(--fd);font-weight:800;font-size:20px;text-align:right}
.kg input:focus{outline:none}
.note{background:var(--panel2);border-radius:12px;padding:12px;font-size:14px}
.note b{color:var(--text)}

/* comida */
.cap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;overflow:hidden;border-radius:16px;border:0;padding:16px;min-height:118px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:8px;color:#fff;background:var(--track)}
.tile.b{background:var(--panel2);color:var(--text);border:1.5px solid var(--line)}
.tile::after{content:"";position:absolute;right:-20px;top:-10px;width:70px;height:150px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 4px,transparent 4px 14px);transform:skewX(-18deg);pointer-events:none}
.tile .t{font-family:var(--fd);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase}
.tile svg{width:30px;height:30px}
.minor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:none;cursor:pointer;font-size:20px}
.daynav button[disabled]{opacity:.3}
.meal{display:flex;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.meal .info{flex:1;min-width:0}
.meal .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .k{font-size:22px;line-height:1;text-align:right}
.x{width:36px;height:36px;border-radius:10px;border:0;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:18px;flex:0 0 auto}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:12px;display:block}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item.off{opacity:.4}
.item .info{flex:1;min-width:0}
.mults{display:flex;gap:6px;flex-wrap:wrap}
.mult{border:1.5px solid var(--line);background:none;border-radius:10px;padding:6px 10px;cursor:pointer;font-family:var(--fl);font-weight:700;font-size:15px}
.mult.on{background:var(--track);border-color:var(--track);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan);outline:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--track);animation:sp 0.8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* encuesta */
.sv{display:flex;flex-direction:column;gap:18px;padding-block:20px}
.lanes{display:grid;gap:4px}
.lanes i{height:6px;border-radius:3px;background:var(--panel2);display:block}
.lanes i.on{background:var(--track)}
.q{font-family:var(--fd);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1;text-transform:uppercase}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt b{font-family:var(--fl);font-size:19px;font-weight:700}
.opt span{font-size:14px;color:var(--muted)}
.opt.on{border-color:var(--track);background:var(--trackSoft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 16px;cursor:pointer;font-family:var(--fl);font-weight:700;font-size:18px;min-width:64px}
.chipbtn.on{border-color:var(--track);background:var(--track);color:#fff}
.svnav{display:flex;gap:10px}
.svnav .btn{flex:1}
.welcome{padding-block:28px 16px;display:flex;flex-direction:column;gap:20px}
.welcome h1{font-family:var(--fd);font-weight:900;font-size:clamp(46px,14vw,74px);line-height:.88;text-transform:uppercase}
.welcome h1 em{font-style:normal;color:var(--track)}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .n{font-family:var(--fd);font-weight:900;font-size:30px;color:var(--track);line-height:1;width:30px;flex:0 0 auto}
.feat p{color:var(--muted);font-size:14px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat>div{background:var(--panel2);border-radius:12px;padding:12px}
.stat .num{font-size:28px;line-height:1;display:block;margin-top:4px}

/* navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(12,16,32,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding-block:6px}
.nb{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--dim);font-family:var(--fl);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.nb svg{width:24px;height:24px}
.nb.on{color:var(--text)}
.nb.on svg{color:var(--track)}
.fab{width:62px;height:62px;border-radius:50%;background:var(--track);color:#fff;display:flex;align-items:center;justify-content:center;margin:-26px auto 0;box-shadow:0 6px 20px rgba(255,87,51,.4);border:4px solid var(--ink)}
.fab svg{width:28px;height:28px;color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--text);color:var(--ink);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast button{background:none;border:0;color:var(--track);font-weight:800;cursor:pointer;text-transform:uppercase;font-family:var(--fl);font-size:15px}
.loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spark{width:100%;height:80px;display:block}

/* demostraciones de ejercicio */
.exhead{display:flex;gap:12px;align-items:flex-start}
.exhead.bigd{flex-direction:column;align-items:stretch}
.exinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.demo{flex:0 0 auto;width:108px;aspect-ratio:160/130;border-radius:12px;background:var(--panel2);border:0;padding:0;cursor:pointer;display:block;overflow:hidden;max-width:100%}
.demo.big{width:100%}
.demo svg{width:100%;height:100%;display:block}
.demo line,.demo path{stroke-linecap:round;stroke-linejoin:round;fill:none}
.demo .fg{stroke:var(--text)}.demo .hl{stroke:var(--track)}.demo .far{stroke:var(--dim)}.demo .pr{stroke:var(--line)}.demo .eq{stroke:var(--muted)}
a.btn{text-decoration:none}

/* macros detallados */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.mrow .bar{grid-column:1/-1;margin-top:2px}
.mrow .r{font-family:var(--fl);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini>div{background:var(--panel2);border-radius:10px;padding:8px 10px;min-width:0}
.mini .num{font-size:20px;line-height:1.1;display:block}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.mchip{background:var(--panel2);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;min-width:64px}
.mchip .num{font-size:20px;line-height:1}
.sugg{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sugg .info{flex:1;min-width:0}


.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.trio .num{font-size:clamp(24px,7vw,32px);line-height:1.05}
.chipbtn.sm{font-size:15px;padding:8px 12px;min-width:0}
.hx{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.hx .info{flex:1;min-width:0}
.hx .info b{display:block}
.demo.sm{width:78px}
.hx .demo.big{flex-basis:100%;width:100%}
.tick{width:48px;height:48px;border-radius:12px;border:2px solid var(--muted);background:none;color:var(--dim);font-size:22px;font-weight:800;cursor:pointer;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tick small{font-family:var(--fl);font-size:10px;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.tick.on{background:var(--good);border-color:var(--good);color:#06281A}

/* temporizador y agua */
.btn svg{width:20px;height:20px;flex:0 0 auto}
body.has-timer main{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
.timer{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:35;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.timer .box{max-width:560px;margin:0 auto;background:var(--panel2);border:2px solid var(--track);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.timer .t{font-family:var(--fd);font-weight:900;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;min-width:84px}
.timer .tm{flex:1;min-width:0}
.timer .tm .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.timer .bar i{background:var(--track);transition:width .25s linear}
.tbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-family:var(--fl);font-weight:700;font-size:15px;flex:0 0 auto}
.tbtn.wide{width:auto;padding:0 16px;background:var(--good);border-color:var(--good);color:#06281A;text-transform:uppercase}
.timer.done .box{border-color:var(--good);animation:flash .7s ease-in-out 5}
.timer.done .t{color:var(--good)}
@keyframes flash{50%{box-shadow:0 0 0 6px rgba(61,220,151,.45),0 10px 30px rgba(0,0,0,.55)}}

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const z=n=>String(n).padStart(2,'0');
function dkey(d=new Date()){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function parseKey(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)}
function daysBetween(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5)}
function mondayOf(k){return addDays(k,-((parseKey(k).getDay()+6)%7))}
const WDN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ---------- almacenamiento: cuenta de Google (Firestore) con copia en el teléfono ---------- */
const Store={mode:'local',fs:null,uid:null,q:{},timers:{},
 pre(){return 'kambio:'+(this.uid||'anon')+':'},
 lget(k){try{const v=localStorage.getItem(this.pre()+k);return v?JSON.parse(v):null}catch(e){return null}},
 lset(k,v){try{localStorage.setItem(this.pre()+k,JSON.stringify(v))}catch(e){}},
 ref(k){return FB.doc(this.fs,'users',this.uid,'data',k)},
 async get(k){
  if(this.mode==='cloud'){
   try{const sn=await FB.getDoc(this.ref(k));if(sn.exists()){const d=JSON.parse(sn.data().json);this.lset(k,d);return d}return this.lget(k)}catch(e){return this.lget(k)}
  }
  return this.lget(k);
 },
 save(k,v,delay=400){
  this.lset(k,v);
  if(this.mode!=='cloud') return;
  clearTimeout(this.timers[k]);
  this.timers[k]=setTimeout(()=>{
   const body={json:JSON.stringify(v),t:Date.now()};
   const prev=this.q[k]||Promise.resolve();
   this.q[k]=prev.then(()=>FB.setDoc(this.ref(k),body)).catch(()=>toast('Sin conexión: quedó guardado en el teléfono y se sube cuando vuelva la señal.'));
  },delay);
 }
};

/* ---------- cálculos de nutrición ---------- */
const ACT={sed:1.2,lig:1.3,mod:1.4,alt:1.5,muy:1.6};
function latestW(p){const a=p.pesos||[];return a.length?a[a.length-1].kg:p.peso}
function calc(p){
 const w=latestW(p),h=p.estatura,a=p.edad,male=p.sexo==='h';
 const bmr=10*w+6.25*h-5*a+(male?5:-161);
 const tdee=bmr*((ACT[p.actividad]||1.3)+(p.dias||4)*0.025);
 const r=p.ritmo||'m';let target=tdee;
 if(p.objetivo==='grasa'){let def=({c:.005,m:.0075,a:.01}[r])*w*7700/7;def=Math.min(def,tdee*.25);target=tdee-def}
 else if(p.objetivo==='musculo') target=tdee+({c:150,m:250,a:400}[r]);
 else if(p.objetivo==='recomp') target=tdee*(1-({c:.05,m:.1,a:.15}[r]));
 else if(p.objetivo==='fuerza') target=tdee+({c:0,m:150,a:250}[r]);
 const floor=Math.max(male?1500:1200,bmr);
 target=Math.round(Math.max(target,floor)/10)*10;
 const hm=h/100,bmi=w/(hm*hm),refW=bmi>=30?25*hm*hm:w;
 const pk={grasa:2.0,recomp:2.0,musculo:1.8,fuerza:1.8,salud:1.6}[p.objetivo]||1.8;
 const prot=Math.round(pk*refW);
 const fat=Math.round(Math.max(target*.25/9,0.6*refW));
 const carb=Math.max(50,Math.round((target-prot*4-fat*9)/4));
 const water=Math.round(w*0.035*10)/10;
 const weekly=(target-tdee)*7/7700;
 let weeks=null;
 if(p.pesoMeta&&Math.abs(weekly)>0.05){const diff=p.pesoMeta-w;if(Math.sign(diff)===Math.sign(weekly)) weeks=Math.ceil(Math.abs(diff/weekly))}
 return {bmr,tdee,target,prot,fat,carb,water,glasses:Math.ceil(water/0.25),weekly,weeks,bmi,w,fib:Math.round(14*target/1000),azu:Math.round(target*0.1/4),sod:2300};
}

const BODY=f=>f<0.15?['Fit','good']:f<0.5?['Normal','']:f<0.9?['Gordito','hot']:['Gordo','hot'];
function moodFor(){
 const p=S.profile,c=dayTargets(S.today),base=calc(p),t=totals(S.today),d=day(S.today),w=weekIdx(S.today),ses=sessionFor(),hr=new Date().getHours();
 const pk=t.kcal/c.target,pp=t.p/c.prot,gl=base.glasses,trained=ses.rest||sesDone(ses,d,w),logged=d.meals.length>0,over=Math.round(t.kcal-c.target);
 const minC=Math.max(5,Math.round(over/(7*base.w/60)/5)*5);
 if(pk>1.10) return {m:'enojado',f:1,t:'¡Te pasaste!',x:'Kambito engordó. Vas '+fmt(over)+' kcal por encima de tu meta. Unos '+minC+' min de caminadora inclinada lo compensan, o come más liviano mañana.'};
 if(pk>1) return {m:'triste',f:0.7,t:'Te pasaste un poquito',x:'Kambito se puso gordito. '+fmt(over)+' kcal por encima. No pasa nada: con '+minC+' min de cardio suave quedas en tu meta.'};
 if(t.az>c.azu) return {m:'preocupado',t:'Mucha azúcar hoy',x:'Llevas '+fmt(t.az)+' g y el máximo recomendado es '+c.azu+' g. Prefiere fruta entera y agua en vez de bebidas azucaradas.'};
 if(t.na>c.sod) return {m:'preocupado',t:'Mucho sodio hoy',x:'Llevas '+fmt(t.na)+' mg y el máximo es 2.300 mg. Toma agua y evita embutidos y paquetes el resto del día.'};
 if(logged&&pk>=0.85&&pp>=0.9&&d.agua>=gl&&trained) return {m:'fuerte',f:0,t:'¡Día perfecto!',x:'Kambito está fit. Cumpliste calorías, proteína, agua y entreno. Así se construye el kambio.'};
 if(hr>=19&&logged&&pp<0.6) return {m:'triste',f:0.35,t:'Te falta proteína',x:'Llevas '+fmt(t.p)+' de '+c.prot+' g. Pollo, atún, huevos o un batido te ayudan a cerrar el día.'};
 if(!logged&&hr>=11) return {m:'preocupado',t:'¿Y la comida?',x:'Aún no registras nada hoy. Tómale una foto a tu próximo plato.'};
 const tip=[];
 if(!trained) tip.push('te falta el entreno de '+(ses.key==='CARDIO'?'cardio':sesLabel(splitKeys(p),ses.key)));
 if(d.agua<gl) tip.push('llevas '+d.agua+' de '+gl+' vasos de agua');
 return {m:'feliz',t:'¡Vas bien!',x:'Te quedan '+fmt(c.target-t.kcal)+' kcal y '+fmt(Math.max(0,c.prot-t.p))+' g de proteína.'+(tip.length?' Ojo: '+tip.join(' y ')+'.':'')};
}

function mealBudget(tp){
 const c=dayTargets(S.today),t=totals(S.today),d=day(S.today),R=c.target-t.kcal,Rp=Math.max(0,c.prot-t.p);
 const done=new Set(d.meals.filter(m=>m.fuente!=='suplemento').map(m=>m.tipo));const pend=Object.keys(MEALW).filter(k=>k===tp||!done.has(k));
 const share=MEALW[tp]/pend.reduce((a,k)=>a+MEALW[k],0);
 if(R<=150) return {kcal:150,p:Math.min(20,Math.max(10,Rp)),over:true,R};
 return {kcal:Math.round(R*share/10)*10,p:Math.round(Rp*share),R,Rp,c:Math.max(0,c.carb-t.c),g:Math.max(0,c.fat-t.g)};
}
function qcStatic(tp,b){

 L.sort((a,z)=>(z.p/z.kcal)-(a.p/a.kcal));
 return L.length?L.slice(0,4):QC_DB.snack.map(([n,po,k,p,c,g])=>({nombre:n,porciones:po,kcal:k,p,c,g})).filter(o=>o.kcal<=Math.max(b.kcal,130)).slice(0,3);
}

function spark(ws,meta){
 if(ws.length<2) return '<p class="small muted">Registra tu peso varias veces para ver la tendencia aquí.</p>';
 const pts=ws.slice(-20),vals=pts.map(x=>x.kg).concat(meta?[meta]:[]);
 const mn=Math.min(...vals)-0.5,mx=Math.max(...vals)+0.5,W=300,H=80;
 const X=i=>8+i*(W-16)/(pts.length-1),Y=v=>H-8-(v-mn)/(mx-mn)*(H-16);
 const d=pts.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.kg).toFixed(1)).join(' ');
 const last=pts[pts.length-1],first=pts[0],diff=last.kg-first.kg;
 return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+(meta?'<line x1="0" x2="'+W+'" y1="'+Y(meta)+'" y2="'+Y(meta)+'" stroke="var(--cyan)" stroke-dasharray="4 4" stroke-width="1.2"/>':'')+'<path d="'+d+' L'+X(pts.length-1)+' '+H+' L'+X(0)+' '+H+' Z" fill="var(--trackSoft)"/><path d="'+d+'" fill="none" stroke="var(--track)" stroke-width="2.5" vector-effect="non-scaling-stroke"/><circle cx="'+X(pts.length-1)+'" cy="'+Y(last.kg)+'" r="4" fill="var(--track)"/></svg><p class="small"><b>'+(diff<=0?'':'+')+diff.toFixed(1).replace('.',',')+' kg</b> <span class="muted">desde '+esc(niceDate(first.f))+(meta?' · línea punteada: meta '+String(meta).replace('.',',')+' kg':'')+'</span></p>';
}

function errMsg(e){
 const c=e&&e.code;
 if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){S.aiOff=true;return 'El análisis con IA no está disponible. Puedes registrar la comida a mano.'}
 if(c==='offline') return 'Sin conexión a internet. Regístrala a mano o intenta cuando tengas señal.';
 if(c==='ai_disabled') return 'La IA todavía no está disponible. Intenta en unos minutos o regístrala a mano.';
 if(c==='rate_limited') return 'Llegaste al límite gratuito de análisis por ahora. Intenta en un rato o regístrala a mano.';
 if(c==='image_rejected') return 'No se pudo leer esa foto. Prueba con otra más nítida y con buena luz.';
 if(c==='images_unavailable'){S.imgOK=false;return 'Esta vista no permite enviar fotos. Usa "Describir" para escribir lo que comiste.'}
 if(c==='session_expired') return 'Tu sesión expiró. Vuelve a entrar con Google y toca Analizar.';
 if(c==='invalid_json'||c==='empty_completion'||c==='refused') return 'No se obtuvo un resultado claro. Toca Analizar otra vez o agrega un detalle.';
 return 'Falló la conexión. Toca Analizar otra vez.';
}
const JSONFMT='Responde SOLO con un objeto JSON con esta forma exacta:\n{"nombre":"nombre corto del plato o producto","items":[{"nombre":"alimento","cantidad":"ej. 150 g o 1 unidad","kcal":0,"proteina":0,"carbohidratos":0,"grasa":0,"fibra":0,"azucar":0,"sodio":0}],"confianza":"alta|media|baja","nota":"una frase breve en español con algo útil (ej. cómo mejorar la proteína)"}\nkcal en kilocalorías; proteína, carbohidratos, grasa, fibra y azúcar en gramos; sodio en miligramos. Números sin unidades. Si no se ve comida, devuelve "items":[] y explica en "nota".';
async function analyze(){
 const a=S.an;if(!a) return;
 if(a.mode==='texto'&&!(a.texto||'').trim()){a.err='Escribe qué comiste.';a.status='error';render();return}
 a.status='loading';a.err=null;S.askedOnce=true;render();
 a.ctl=new AbortController();
 let prompt;
 if(a.mode==='etiqueta') prompt='Eres un nutricionista deportivo. La imagen es la etiqueta o tabla nutricional de un producto empacado (probablemente en español, de Colombia). Lee el tamaño de porción y los valores por porción: calorías, proteína, carbohidratos totales, grasa total, fibra, azúcares y sodio. La persona dice que comió: "'+(a.porcion||'1 porción')+'". Calcula los valores para esa cantidad. Devuelve un solo item con el nombre del producto, y en "cantidad" lo que comió. Si un valor no se lee, estímalo y baja la confianza.\n'+(a.nota?'Detalle de la persona: '+a.nota+'\n':'')+JSONFMT;
 else if(a.mode==='plato') prompt='Eres un nutricionista deportivo en Colombia. La imagen es una foto de un plato de comida. Identifica cada alimento visible (ten en cuenta preparaciones típicas colombianas: arroz, fríjoles, lentejas, arepa, plátano maduro o patacón, papa, yuca, carne, pollo, cerdo, huevo, aguacate, ensalada, jugos). Estima los gramos de cada uno usando el plato y los cubiertos como referencia de tamaño, e incluye el aceite si se ve frito. Calcula calorías y macros por alimento.\n'+(a.nota?'Detalle de la persona: '+a.nota+'\n':'')+JSONFMT;
 else prompt='Eres un nutricionista deportivo en Colombia. Estima calorías y macros de esta comida descrita por la persona: "'+a.texto.trim()+'". Separa por alimento y usa porciones típicas colombianas cuando no se especifiquen.\n'+JSONFMT;
 try{
  const opts={signal:a.ctl.signal,cache:false};
  if(a.file) opts.images=[a.file];
  const r=await S.sample.json(prompt,opts);
  if(S.an!==a) return;
  const items=(r&&Array.isArray(r.items)?r.items:[]).map(it=>({nombre:String(it.nombre||'Alimento'),cantidad:String(it.cantidad||''),kcal:num(it.kcal),p:num(it.proteina),c:num(it.carbohidratos),g:num(it.grasa),f:num(it.fibra),az:num(it.azucar),na:num(it.sodio),on:true}));
  a.result={nombre:String((r&&r.nombre)||'Comida'),items,confianza:['alta','media','baja'].includes(r&&r.confianza)?r.confianza:'media',nota:String((r&&r.nota)||'')};
  a.status='done';
 }catch(e){
  if(S.an!==a) return;
  if(e&&e.code==='cancelled'){a.status='idle'}else{a.status='error';a.err=errMsg(e)}
 }
 render();
}
function makeThumb(file){return new Promise(res=>{try{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const s=112,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),m=Math.min(img.naturalWidth,img.naturalHeight);x.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',0.6))}catch(e){res(null)}URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url}catch(e){res(null)}})}

let actx=null;
function unlockAudio(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(n,f){if(!actx)return;try{const t0=actx.currentTime+0.02;for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain(),t=t0+i*0.32;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.28)}}catch(e){}}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function restSec(r){const m=String(r).match(/(\d+)\s*(min|s)/);if(!m)return 60;return m[2]==='min'?+m[1]*60:+m[1]}
const T={on:false,end:0,total:0,paused:false,remain:0,label:'',done:false,iv:null,wl:null,ver:0};
function keepAwake(on){try{if(on&&!T.wl&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{T.wl=l}).catch(()=>{});if(!on&&T.wl){T.wl.release().catch(()=>{});T.wl=null}}catch(e){}}
function tleft(){return T.paused?T.remain:Math.max(0,(T.end-Date.now())/1000)}
function startTimer(sec,label){unlockAudio();Object.assign(T,{on:true,end:Date.now()+sec*1000,total:sec,paused:false,remain:sec,label,done:false,warned:false});T.ver++;if(!T.iv)T.iv=setInterval(tick,250);keepAwake(true);tick()}
function stopTimer(){T.on=false;T.done=false;clearInterval(T.iv);T.iv=null;keepAwake(false);drawTimer()}
function tick(){
 if(!T.on){drawTimer();return}
 const l=tleft();
 if(!T.paused&&!T.done){if(l<=3.2&&l>0.2&&!T.warned){T.warned=true;beep(1,660)}if(l<=0){T.done=true;T.doneAt=Date.now();beep(3,990);buzz([400,150,400,150,600]);notify('Descanso terminado','A la siguiente serie.');keepAwake(false)}}
 if(T.done&&Date.now()-T.doneAt>10000){stopTimer();return}
 drawTimer();
}
let tBuilt='';
function drawTimer(){
 const el=$('#timer');
 if(!T.on){if(el.innerHTML)el.innerHTML='';document.body.classList.remove('has-timer');tBuilt='';return}
 document.body.classList.add('has-timer');
 const key=T.ver+':'+T.done+':'+T.paused;
 if(tBuilt!==key){tBuilt=key;el.innerHTML='<div class="timer'+(T.done?' done':'')+'" role="timer" aria-live="polite"><div class="box"><span class="t" id="tT"></span><div class="tm"><div class="lbl" id="tL"></div><div class="bar"><i id="tB"></i></div></div>'+
  (T.done?'<button class="tbtn wide" data-act="tClose">Listo</button>':'<button class="tbtn" data-act="tAdd" data-v="-15" aria-label="Quitar 15 segundos">−15</button><button class="tbtn" data-act="tAdd" data-v="15" aria-label="Sumar 15 segundos">+15</button><button class="tbtn" data-act="tPause" aria-label="'+(T.paused?'Seguir':'Pausar')+'">'+(T.paused?'▶':'❚❚')+'</button><button class="tbtn" data-act="tClose" aria-label="Cerrar temporizador">×</button>')+'</div></div>'}
 const l=Math.ceil(tleft());
 $('#tT').textContent=T.done?'¡YA!':Math.floor(l/60)+':'+z(l%60);
 $('#tL').textContent=T.done?'Descanso terminado: a la siguiente serie':(T.paused?'En pausa · ':'')+T.label;
 $('#tB').style.width=(T.total?Math.min(100,(1-tleft()/T.total)*100):100).toFixed(1)+'%';
}

function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)})}
async function shrink(b){try{const url=URL.createObjectURL(b);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
 const sc=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return (await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)))||b}catch(e){return b}}
function parseJSON(t){try{return JSON.parse(t)}catch(e){}const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
 const a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a>=0&&z>a){try{return JSON.parse(t.slice(a,z+1))}catch(e){}}throw {code:'invalid_json',message:'json'}}
function makeGemini(ai,name){
 const names=[name||'gemini-3.5-flash','gemini-3.5-flash','gemini-3.5-flash-lite','gemini-flash-latest','gemini-flash-lite-latest'].filter((v,i,a)=>a.indexOf(v)===i);let idx=0;
 const model=()=>FB.getGenerativeModel(ai,{model:names[idx],generationConfig:{responseMimeType:'application/json',temperature:0.4}});
 const run=async(prompt,opts={})=>{
  if(!navigator.onLine) throw {code:'offline'};
  const parts=[{text:prompt+'\nResponde en español.'}];
  if(opts.images){const L=opts.images instanceof Blob?[opts.images]:Array.from(opts.images);for(const bl of L){parts.push({inlineData:{mimeType:'image/jpeg',data:await blobToB64(await shrink(bl))}})}}
  const abortP=new Promise((_,rej)=>{if(opts.signal){if(opts.signal.aborted)rej({code:'cancelled'});opts.signal.addEventListener('abort',()=>rej({code:'cancelled'}))}});
  const key=((window.KAMBIO_CONFIG||{}).geminiKey||'').trim();
  // Con clave propia de Gemini (Google AI Studio) se llama directo a la API; si no, por Firebase AI Logic
  const direct=async()=>{const ctl=new AbortController();if(opts.signal)opts.signal.addEventListener('abort',()=>ctl.abort());
   const body={contents:[{role:'user',parts:parts.map(p=>p.text?{text:p.text}:{inline_data:{mime_type:p.inlineData.mimeType,data:p.inlineData.data}})}],generationConfig:{responseMimeType:'application/json',temperature:0.4}};
   const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+names[idx]+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
   const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
   return ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('')};
  const call=async()=>key?direct():(await model().generateContent(parts)).response.text();
  try{return await Promise.race([call(),abortP])}
  catch(e){if(e&&e.code==='cancelled')throw e;const msg=String(e&&e.message||e);
   if(/genai config/i.test(msg)) throw {code:'ai_disabled',message:msg};
   // modelo retirado, no disponible o saturado: probar el siguiente de la lista
   if(/404|not found|no longer available|not supported for generateContent|500|503|high demand|overloaded|unavailable/i.test(msg)&&idx<names.length-1){idx++;return await run(prompt,opts)}
   if(/quota|429|rate limit|resource.?exhausted/i.test(msg)) throw {code:'rate_limited',message:msg};
   if(/api-not-enabled|not been used|disabled|PERMISSION_DENIED|403/i.test(msg)) throw {code:'ai_disabled',message:msg};
   if(!navigator.onLine) throw {code:'offline'};
   throw {code:'upstream_error',message:msg}}
 };
 const f=async(p,o)=>({text:await run(p,o),truncated:false});
 f.json=async(p,o)=>parseJSON(await run(p,o));
 f.limits=async()=>({images:{maxCount:4}});
 return f;
}

async function doLogin(){
 const pr=new FB.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
 try{await FB.signInWithPopup(fbAuth,pr)}
 catch(e){const c=(e&&e.code)||'';
  if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await FB.signInWithRedirect(fbAuth,pr)}catch(x){loginScreen(authMsg(x))}}
  else{const m=authMsg(e);if(m)loginScreen(m)}}
}
async function startData(){
 S.days={};S.view='hoy';S.sv={step:0,d:{lim:[]}};
 S.profile=await Store.get('profile');
 S.training=await Store.get('training');
 const cfg=await Store.get('ajustes');S.cfg={agua:Object.assign({on:false,cada:60,desde:7,hasta:21,since:0},cfg&&cfg.agua),supps:(cfg&&Array.isArray(cfg.supps))?cfg.supps:[]};
 if(S.profile&&!S.training){S.training={start:mondayOf(S.today),done:{},swaps:{},cargas:{}};Store.save('training',S.training,0)}
 if(!S.profile&&S.user&&S.user.name) S.sv.d.nombre=S.user.name.split(' ')[0];
 const ks=[];for(let i=0;i<7;i++) ks.push(addDays(S.today,-i));
 await Promise.all(ks.map(loadDay));
 render();
}
/* ---------- arranque ---------- */
(async function boot(){
 const C=window.KAMBIO_CONFIG||{};
 if(!window.FB||!C.firebase||!C.firebase.apiKey||/PEGA/.test(C.firebase.apiKey)){$('#app').innerHTML='<div class="wrap"><div class="note" style="margin-top:24px">Falta la configuración de Firebase en config.js.</div></div>';return}
 fbApp=FB.initializeApp(C.firebase);fbAuth=FB.getAuth(fbApp);
 try{await FB.setPersistence(fbAuth,FB.browserLocalPersistence)}catch(e){}
 try{Store.fs=FB.initializeFirestore(fbApp,{localCache:FB.persistentLocalCache({tabManager:FB.persistentMultipleTabManager()})})}catch(e){Store.fs=FB.initializeFirestore(fbApp,{})}
 try{S.sample=makeGemini(FB.getAI(fbApp,{backend:new FB.GoogleAIBackend()}),C.model);S.imgOK=true}catch(e){S.sample=null}
 let loginErr='';try{await FB.getRedirectResult(fbAuth)}catch(e){loginErr=authMsg(e)}
 let uidOn=null;
 FB.onAuthStateChanged(fbAuth,async u=>{
  if(!u){uidOn=null;S.user=null;Store.mode='local';Store.uid=null;S.profile=null;loginScreen(loginErr);return}
  S.user={name:u.displayName||'',email:u.email||'',photo:u.photoURL||''};
  if(uidOn===u.uid) return;uidOn=u.uid;Store.uid=u.uid;Store.mode='cloud';
  $('#app').innerHTML='<div class="wrap"><div class="loading"><div class="spin"></div><div class="lbl">Cargando tu plan…</div></div></div>';
  await startData();
 });
 if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
 requestAnimationFrame(demoLoop);
 setInterval(()=>{if(S.user&&S.profile)waterCheck()},15000);
})();
</script>
